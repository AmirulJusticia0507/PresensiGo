name: presensigo_app
description: "Smart Attendance System - Geofencing & Face Recognition"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & Geofencing
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Camera & Face Recognition
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # State Management
  provider: ^6.1.0

  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

  # UI
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Utils
  uuid: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

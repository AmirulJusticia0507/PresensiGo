name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      
      - name: Run tests
        run: cd backend && go test ./... -v
      
      - name: Run vet
        run: cd backend && go vet ./...
      
      - name: Check formatting
        shell: bash
        run: |
          cd backend
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- '*.go' | sed 's#^backend/##')"
          if [[ -n "$files" ]]; then
            unformatted="$(gofmt -l $files)"
            test -z "$unformatted" || { echo "$unformatted"; exit 1; }
          fi
      
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
      
      - name: Generate coverage
        run: cd backend && go test ./... -coverprofile=coverage.out
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Get dependencies
        run: cd presensigo_mobile && flutter pub get
      
      - name: Run analyze
        run: cd presensigo_mobile && flutter analyze --no-fatal-infos
      
      - name: Run tests
        run: cd presensigo_mobile && flutter test --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./presensigo_mobile/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false

  status:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: always()
    
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.mobile.result }}" != "success" ]; then
            echo "Backend status: ${{ needs.backend.result }}"
            echo "Mobile status: ${{ needs.mobile.result }}"
            exit 1
          fi
          echo "All checks passed!"
